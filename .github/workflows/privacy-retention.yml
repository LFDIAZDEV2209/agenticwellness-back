name: Privacy retention review

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/privacy-retention.yml'
      - 'scripts/qa/kan-170/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-retention:
    name: Privacy retention preflight tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s scripts/qa/kan-170 -p 'test*.py'
